[project]
name = "FicImageScript"
version = "5.0.0"
authors = [
    { name = "Emmanuel C. Jemeni", email = "jemenichinonso11@gmail.com" }
]
description = "FicImage is an application designed to enhance the reading experience of FicHub files."
readme = "PYPI_README.rst"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fanfiction", "fichub", "ficimage", "image", "epub", "html", "zip"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: Console",
    "Natural Language :: English",
]
dependencies = [
    'beautifulsoup4>=4.14.3',
    'certifi>=2025.11.12',
    'charset-normalizer>=3.4.4',
    'ebooklib>=0.20',
    'idna>=3.11',
    'lxml>=6.0.2',
    'packaging>=25.0',
    'pillow>=12.0.0',
    'pymupdf>=1.26.7',
    'requests>=2.32.5',
    'six>=1.17.0',
    'soupsieve>=2.8.1',
    'typing-extensions>=4.15.0',
    'urllib3>=2.6.2',
]

[project.scripts]
ficimage = "FicImageScript.main:main"

[project.urls]
"Homepage" = "https://github.com/Jemeni11/FicImage"
"Bug Tracker" = "https://github.com/Jemeni11/FicImage/issues"
"Changelog" = "https://github.com/Jemeni11/FicImage/blob/main/CHANGELOG.md"
"Funding" = "https://buymeacoffee.com/jemeni11"

[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/build-system/#build-time-dependencies
requires = ["setuptools"]
build-backend = "setuptools.build_meta"